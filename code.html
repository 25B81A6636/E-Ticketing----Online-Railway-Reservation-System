<!DOCTYPE html>
<html>
<head>
    <title>E-Ticketing - Railway Reservation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #1565c0;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 70%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #1565c0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: gray;
        }
    </style>
</head>

<body>

    <header>
        <h1>E-Ticketing</h1>
        <p>Online Railway Reservation System</p>
    </header>

    <div class="container">

        <h2>Book Your Railway Ticket</h2>

        <form>

            <label>From Station</label>
            <input type="text" placeholder="Enter source station" required>

            <label>To Station</label>
            <input type="text" placeholder="Enter destination station" required>

            <label>Journey Date</label>
            <input type="date" required>

            <label>Class</label>
            <select required>
                <option value="">Select Class</option>
                <option>Sleeper (SL)</option>
                <option>AC 3 Tier (3A)</option>
                <option>AC 2 Tier (2A)</option>
                <option>AC First Class (1A)</option>
            </select>

            <label>Passenger Name</label>
            <input type="text" placeholder="Enter passenger name" required>

            <label>Age</label>
            <input type="number" placeholder="Enter age" required>

            <label>Gender</label>
            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Email</label>
            <input type="email" placeholder="Enter email" required>

            <button type="submit">Book Ticket</button>

        </form>

    </div>

    <div class="footer">
        <p>© 2026 Online Railway Reservation System</p>
    </div>

</body>
</html>
